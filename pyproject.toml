[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argbridge-experiment"
version = "0.1.0"
description = "Reversible strict-tool schema transport for presence-sensitive JSON arguments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/hans992/ArgBridge"
Issues = "https://github.com/hans992/ArgBridge/issues"

[project.scripts]
argbridge = "argbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

